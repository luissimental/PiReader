[project]
name = "PiReader"
version = "0.1.0"
readme = "README.md"
requires-python = ">=3.15"
dependencies = [
    "gpiozero>=2.0.1.post3",
    "python-statemachine>=3.2.2",
    "smbus2>=0.6.1",
    "spidev>=3.8",
]

[project.scripts]
pireader = "pireader:main.main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.17.0",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "PLR2004",
    "S101",
    "SLF001",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["src"]
omit = ["tests/*"]
branch = true

[tool.coverage.report]
exclude_also = [
    'if __name__ == .__main__.:',
    '\A(?s:.*# pragma: exclude file.*)\Z',
]
skip_covered = true
skip_empty = true
show_missing = true
fail_under = 80
